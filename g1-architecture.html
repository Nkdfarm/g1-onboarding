const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K="g1-onboarding-key";
async function decrypt(key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.iv)},key,u8(D.ct));return new TextDecoder().decode(pt);}
async function show(html){if(document.readyState!=="complete")await new Promise(r=>addEventListener("load",r,{once:true}));document.open();document.write(html);document.close();}
async function fromStore(){try{const s=JSON.parse(sessionStorage.getItem(K)||"null");if(!s||s.salt!==D.salt)return false;const key=await crypto.subtle.importKey("raw",u8(s.k),"AES-GCM",false,["decrypt"]);await show(await decrypt(key));return true;}catch(e){return false;}}

 try{const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveKey"]);

  html=await decrypt(key);
